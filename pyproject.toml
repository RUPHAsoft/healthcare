[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

# Frappe Cloud's pre-build validation reads this table (press.api.github.app) and refuses
# the app without it. Bench parses the values with semantic_version.SimpleSpec, so they
# must be version specifiers, never branch names. Mirrors upstream frappe/healthcare v15.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
